services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recovery-ia-qdrant
    ports:
      - "6333:6333"   # REST / dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: recovery-ia-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo_data:/data/db

  backend:
    build: .
    container_name: recovery-ia-backend
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - mongo
